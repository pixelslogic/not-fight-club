<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not a fight game, it's squid game</title>
  <link rel="icon" href="./assets/favicon-DvgVCXvO.ico">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="./assets/favicon-DvgVCXvO.ico">
  <script type="module" crossorigin src="./assets/vendor-C0zxSBbF.js"></script>
  <script type="module" crossorigin src="./assets/script-DvW7Oq28.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-DV8PrLMj.css">
  <link rel="stylesheet" crossorigin href="./assets/script-B3yae7S-.css">
</head>
<body>
  <div class="squid-game-wrapper">
    <div class="page">
      <div class="auth">
        <div class="squid-card">
          <div class="squid-card__front">
            <div class="squid-card__shapes">
              <div class="squid-card__triangle"></div>
              <div class="squid-card__circle"></div>
              <div class="squid-card__square"></div>
            </div>
          </div>
          <div class="squid-card__back">
            <div class="squid-card__number">You're invited</div>
          </div>
        </div>
        <h1 class="auth__title">Welcome</h1>
        <p class="auth__subtitle">Enter your name to join the game</p>
        <form class="form" id="authForm">
          <div class="input">
            <input type="text" class="input__field" id="usernameInput" placeholder="PLAYER NAME" maxlength="20" required>
            <div class="input__error" id="usernameError">
              INVALID NAME! REQUIRES 2 TO 20 CHARACTERS
            </div>
          </div>
          <button type="submit" class="button" id="loginButton">
            ENTER GAME
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
