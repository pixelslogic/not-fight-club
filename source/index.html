<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="icon" href="assets/favicon/favicon.ico">
  <script type="module" crossorigin src="./js/script.js"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <nav class="header__nav">
        <div class="header__logo-wrapper" href="#">
          <img class="header__logo" src="./assets/icon/Logo.svg" alt="squid game logo">
        </div>

        <ul class="nav__list site-list">
          <li>
            <a class="site-list__link" href="https://www.netflix.com/tudum/articles/squid-game-games-explained#Season1">
              Rules of the game
            </a>
          </li>
          <li>
            <a class="site-list__link" href="https://www.netflix.com/es-en/title/81040344" target="_blank">
              <img class="nav__logo" src="./assets/icon/Netflix-Logo.svg" alt="netflix logo">
            </a>
          </li>
          <li>
            <a class="site-list__link">
              LIVE
            </a>
          </li>
          <li>
            <a class="site-list__link">
              PLAY
            </a>
          </li>
          <li>
            <a class="site-list__link">
              DIE
            </a>
          </li>
        </ul>

        <ul class="nav__list social">
          <li>
            <a class="social__link" href="https://www.instagram.com/squidgamenetflix" target="_blank">
              <span class="visually-hidden">instagram</span>
              <img class="social__svg" src="./assets/icon/instagram.svg" alt="instagram icon">
            </a>
          </li>
          <li>
            <a class="social__link" href="https://x.com/squidgame" target="_blank">
              <span class="visually-hidden">twitter / X link</span>
              <img class="social__svg" src="./assets/icon/twitter.svg" alt="twitter icon">
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <div class="main__content">
        <div class="main__text">
          <div class="main__wrapper">
            <h1>
              <img class="main__logo" src="./assets/img/title.png" alt="squid game logo">
            </h1>
            <h2 class="main__subtitle">Will You Survive the Game?</h2>
            <p>Discover the games, learn the rules, and join the players.</p>
            <a class="main__button" href="selection_hero.html">Start Playing</a>
          </div>
          <div class="main__carousel carousel">
            <div class="carousel__spin">
              <img src="assets/img/carousel-1.jpg" alt="player 1 photo">
              <img src="assets/img/carousel-2.jpg" alt="player 2 photo">
              <img src="assets/img/carousel-3.jpg" alt="player 3 photo">
              <img src="assets/img/carousel-4.jpg" alt="player 4 photo">
              <img src="assets/img/carousel-5.jpg" alt="player 5 photo">
              <img src="assets/img/carousel-6.jpg" alt="player 6 photo">
              <img src="assets/img/carousel-7.jpg" alt="player 7 photo">
            </div>
            <div class="main__sound">
              <div class="main__button-wrapper">
                <button class="main__sound-btn" id="soundBtn">
                  <img class="main__sound-icon" src="./assets/icon/sound-pause.svg" alt="sound icon">
                </button>
                <span class="main__sound-text">Mingle Game Song<br>“Round and Round”</span>
              </div>
              <audio id="main-music" autoplay loop>
                <source src="./assets/music/Round and Round (Mingle Song).mp3" type="audio/mpeg">
              </audio>
            </div>
            <div class="carousel__ground"></div>
          </div>
        </div>
        <div class="main__img">
          <img class="main__img-bg" src="./assets/img/character.png" alt="squid game guardian">
        </div>
      </div>
      <div class="main__videos-games">
        <div class="main__videos">
          <div class="main__videos-wrapper swiper videos">
            <div class="swiper-wrapper videos__wrapper">
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/pRxb0WkPYDU?si=9Kps52jztfBexpi2" 
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen></iframe>
              </div>
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/r4QVceQ0eWI?si=tG-LkvkMi1gske5-" 
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen></iframe>
              </div>
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/J1zSjzdMWE8?si=4peMG1qhJJfKQK9D" 
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen></iframe>
              </div>
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/9BuZDzHDHpk?si=YCcSPtpMyB9LoAqb"
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
              </div>
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/cacTG7VQOV8?si=q_HZYy8HiBixrwOF"
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
              </div>
              <div class="swiper-slide videos__slide">
                <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/Idv5_jw8mvo?si=VOzeDf5tMIAVREMX"
                        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
              </div>
            </div>
            <!-- навигация -->
            <div class="swiper-button-next videos__button-next"></div>
            <div class="swiper-button-prev videos__button-prev"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
